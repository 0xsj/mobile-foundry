name: FoundryCatalog
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  FoundryPhysics:
    path: ../../packages/FoundryPhysics
  FoundryKernel:
    path: ../../packages/FoundryKernel
  FoundryHTTP:
    path: ../../packages/FoundryHTTP
  FoundryServices:
    path: ../../packages/FoundryServices
  FoundryData:
    path: ../../packages/FoundryData
  FoundrySession:
    path: ../../packages/FoundrySession
  FoundryQuery:
    path: ../../packages/FoundryQuery
  FoundryUI:
    path: ../../packages/FoundryUI
  FoundryGraphics:
    path: ../../packages/FoundryGraphics
targets:
  FoundryCatalog:
    type: application
    platform: iOS
    info:
      path: Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: FoundryPhysics
      - package: FoundryKernel
      - package: FoundryHTTP
      - package: FoundryServices
      - package: FoundryData
      - package: FoundrySession
      - package: FoundryQuery
      - package: FoundryUI
      - package: FoundryGraphics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobilefoundry.catalog
        PRODUCT_NAME: FoundryCatalog
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 7U72Y3VFHD
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mobile Foundry
        INFOPLIST_KEY_NSCameraUsageDescription: Take a photo to preview filters and image adjustments in Mobile Foundry.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FoundryCatalogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FoundryCatalog
      - package: FoundryKernel
      - package: FoundryHTTP
      - package: FoundryServices
      - package: FoundryData
      - package: FoundrySession
      - package: FoundryQuery
      - package: FoundryUI
      - package: FoundryGraphics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobilefoundry.catalog.tests
        GENERATE_INFOPLIST_FILE: YES
  FoundryCatalogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FoundryCatalog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobilefoundry.catalog.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FoundryCatalog:
    build:
      targets:
        FoundryCatalog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FoundryCatalogTests
        - FoundryCatalogUITests
    archive:
      config: Release
