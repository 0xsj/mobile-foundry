name: FoundryCatalog
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  FoundryKernel:
    path: ../../packages/FoundryKernel
targets:
  FoundryCatalog:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: FoundryKernel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobilefoundry.catalog
        PRODUCT_NAME: FoundryCatalog
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mobile Foundry
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  FoundryCatalog:
    build:
      targets:
        FoundryCatalog: all
    run:
      config: Debug
    archive:
      config: Release
