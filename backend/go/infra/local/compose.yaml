name: mobile-foundry-go
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: mobile_foundry
      POSTGRES_USER: mobile_foundry
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-58432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobile_foundry -d mobile_foundry"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
