name: mobile-foundry-rust
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:${POSTGRES_PORT:-58433}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U app -d app]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
